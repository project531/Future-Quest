
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#10255e"
  >

  <meta
    name="description"
    content="FUTURE QUEST: una aventura RPG sobre convivencia, democracia, memoria y cultura de paz."
  >

  <title>FUTURE QUEST | La aventura comienza</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image.png" href="favicon.png">
</head>

<body>

  <div id="app">

    <!-- ==================================
         ESCENARIO DEL JUEGO
    =================================== -->

    <main
      id="gameScreen"
      class="screen game-screen active"
      aria-label="Ciudad de FUTURE QUEST"
    >
      <div class="world-layout">
        <div class="world-main">
          <div class="world-canvas-wrapper">

            <canvas
              id="world"
              width="960"
              height="600"
              aria-label="Mundo interactivo de FUTURE QUEST"
            >
              Tu navegador no admite Canvas.
            </canvas>

          </div>
        </div>
      </div>
    </main>

    <!-- ==================================
         ELEMENTOS DECORATIVOS DEL INICIO
         No interfieren con game.js
    =================================== -->

    <div
      id="fqArcadeDecoration"
      aria-hidden="true"
    >
      <div class="arcade-rays"></div>
      <div class="arcade-stars"></div>
      <div class="arcade-floor"></div>
    </div>

    <!-- ==================================
         MENSAJE DE ERROR
    =================================== -->

    <div id="fqStartupError" role="alert">
      <h2>⚠️ No se pudo iniciar el juego</h2>
      <p>
        Revisa que <strong>game.js</strong> y
        <strong>style.css</strong> estén en la misma
        carpeta que <strong>index.html</strong>.
      </p>
      <p>Presiona F12 para consultar la consola.</p>
    </div>

  </div>

  <!-- ==================================
       JAVASCRIPT PRINCIPAL
  =================================== -->

  <script src="game.js" defer></script>

  <!-- Decoración y comprobación del inicio -->
  <script>
    window.addEventListener("load", () => {
      const decoration = document.getElementById(
        "fqArcadeDecoration"
      );

      const errorBox = document.getElementById(
        "fqStartupError"
      );

      const updateDecoration = () => {
        const home = document.getElementById(
          "fqStandaloneScreen"
        );

        const visible = Boolean(
          home && home.classList.contains("open")
        );

        decoration.classList.toggle(
          "visible",
          visible
        );
      };

      const observer = new MutationObserver(
        updateDecoration
      );

      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["class"]
      });

      updateDecoration();

      setTimeout(() => {
        if (
          !document.getElementById("fqStandaloneScreen") ||
          !document.getElementById("fqGameInterface")
        ) {
          errorBox.style.display = "block";
        }
      }, 1600);
    });
  </script>

</body>
</html>
